name: Destroy Azure learning lab

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY to create and apply a destroy plan
        required: true
        type: string

permissions: {}

jobs:
  terraform:
    if: inputs.confirmation == 'DESTROY'
    name: Call reusable workflow in destroy mode
    permissions:
      contents: read
      id-token: write

    concurrency:
      group: azure-private-app-dev
      cancel-in-progress: false

    uses: $/.github/workflows/reusable-azure-terraform.yml
    with:
      working_directory: infra/environments/dev
      terraform_version: "1.15.5"
      operation: destroy
      plan_environment: terraform-plan
      apply_environment: development
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      plan_client_id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      apply_client_id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
      resource_group_name: ${{ vars.AZURE_LAB_RESOURCE_GROUP }}
      state_storage_account: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      state_container: ${{ vars.TF_STATE_CONTAINER }}
      state_key: azure-private-app-dev.tfstate
      enable_private_dns_resolver: ${{ vars.ENABLE_PRIVATE_DNS_RESOLVER == 'true' }}
